<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">League of Legends ML Pipeline</title>
  <desc id="desc">Machine learning pipeline from Riot API data to feature engineering, model training, and evaluation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf8f2"/><stop offset="1" stop-color="#e8d0b6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b85c1b"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#151515">League of Legends Match Prediction Pipeline</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="20" fill="#68635e">Riot API timelines → temporal features → ML models → checkpoint evaluation</text>
  <g font-family="Arial, sans-serif">
    <g fill="#fff" stroke="#dfc8b0" stroke-width="2">
      <rect x="70" y="220" width="175" height="120" rx="18"/><rect x="315" y="220" width="180" height="120" rx="18"/><rect x="565" y="220" width="180" height="120" rx="18"/><rect x="815" y="220" width="180" height="120" rx="18"/>
      <rect x="210" y="455" width="200" height="120" rx="18"/><rect x="500" y="455" width="200" height="120" rx="18"/><rect x="790" y="455" width="200" height="120" rx="18"/>
    </g>
    <text x="157" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Riot API</text><text x="157" y="298" text-anchor="middle" font-size="16" fill="#666">match timelines</text>
    <text x="405" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Frame Builder</text><text x="405" y="298" text-anchor="middle" font-size="16" fill="#666">128K+ frames</text>
    <text x="655" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Features</text><text x="655" y="298" text-anchor="middle" font-size="16" fill="#666">256 temporal signals</text>
    <text x="905" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Splits</text><text x="905" y="298" text-anchor="middle" font-size="16" fill="#666">leakage-aware</text>
    <text x="310" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Sequential Models</text><text x="310" y="530" text-anchor="middle" font-size="15" fill="#666">LSTM · GRU · TCN · Transformer</text>
    <text x="600" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Baselines</text><text x="600" y="530" text-anchor="middle" font-size="15" fill="#666">RF · GBDT · XGBoost</text>
    <text x="890" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Evaluation</text><text x="890" y="530" text-anchor="middle" font-size="15" fill="#666">10–30 min checkpoints</text>
  </g>
  <g stroke="#b85c1b" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M245 280 H305"/><path d="M495 280 H555"/><path d="M745 280 H805"/><path d="M905 340 C880 405 760 455 710 485"/><path d="M905 340 C760 405 455 455 410 485"/><path d="M700 515 H780"/></g>
  <g transform="translate(80 585)"><rect width="1040" height="38" rx="19" fill="#b85c1b" opacity="0.12"/><text x="520" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8d4212">Goal: predict match winner and understand how predictability improves as game state evolves</text></g>
</svg>
