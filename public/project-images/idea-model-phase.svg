<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Opinion Dynamics Phase Diagram</title>
  <desc id="desc">Conceptual diagram for mathematical modeling of idea intrusion with mainstream influence, committed minorities, and deradicalization.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf8f2"/><stop offset="1" stop-color="#ead1b5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b85c1b"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#151515">Mathematical Modeling of Idea Intrusion</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="20" fill="#68635e">Dynamical-system view of social influence, committed minorities, and deradicalization</text>
  <g transform="translate(135 155)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="930" height="420" rx="22" fill="#fff" opacity="0.72" stroke="#dfc8b0"/>
    <line x1="80" y1="350" x2="840" y2="350" stroke="#2a2520" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="80" y1="350" x2="80" y2="65" stroke="#2a2520" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="460" y="398" text-anchor="middle" font-size="18" fill="#5f5750">Committed minority influence</text>
    <text x="-190" y="32" transform="rotate(-90)" text-anchor="middle" font-size="18" fill="#5f5750">System adoption / fragmentation</text>
    <path d="M95 325 C250 318 315 280 385 220 C470 145 595 112 820 98" fill="none" stroke="#b85c1b" stroke-width="6"/>
    <path d="M110 310 C245 260 310 238 390 236 C520 236 610 290 810 300" fill="none" stroke="#4f46e5" stroke-width="5" stroke-dasharray="14 10"/>
    <circle cx="385" cy="220" r="12" fill="#b85c1b"/><circle cx="390" cy="236" r="10" fill="#4f46e5"/>
    <text x="420" y="205" font-size="17" font-weight="700" fill="#241f1a">critical threshold</text>
    <g><rect x="575" y="35" width="275" height="105" rx="16" fill="#f8efe6" stroke="#dfc8b0"/><line x1="600" y1="65" x2="650" y2="65" stroke="#b85c1b" stroke-width="6"/><text x="665" y="70" font-size="16" fill="#333">high deradicalization</text><line x1="600" y1="102" x2="650" y2="102" stroke="#4f46e5" stroke-width="5" stroke-dasharray="12 8"/><text x="665" y="107" font-size="16" fill="#333">low deradicalization</text></g>
  </g>
  <g font-family="Arial, sans-serif" transform="translate(180 605)"><text x="0" y="0" font-size="18" fill="#6b625a">Key idea: small parameter changes can shift long-run behavior from stability to fragmentation or adoption.</text></g>
</svg>
