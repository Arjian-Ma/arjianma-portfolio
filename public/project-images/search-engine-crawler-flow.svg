<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Crawler Robustness Flow</title>
  <desc id="desc">Crawler pipeline from URL queue through validation, robots checks, deduplication, storage, and monitoring.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf8f2"/><stop offset="1" stop-color="#f1dcc3"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b85c1b"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#151515">Robust Crawler Flow</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="20" fill="#68635e">Polite crawling, duplicate detection, and monitoring for long-running distributed jobs</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#222">
    <g fill="#fff" stroke="#dfc8b0" stroke-width="2">
      <rect x="80" y="250" width="155" height="90" rx="16"/><rect x="300" y="250" width="155" height="90" rx="16"/><rect x="520" y="250" width="155" height="90" rx="16"/><rect x="740" y="250" width="155" height="90" rx="16"/><rect x="960" y="250" width="155" height="90" rx="16"/>
      <rect x="300" y="450" width="155" height="90" rx="16"/><rect x="520" y="450" width="155" height="90" rx="16"/><rect x="740" y="450" width="155" height="90" rx="16"/>
    </g>
    <text x="157" y="290" text-anchor="middle" font-weight="700">URL Queue</text><text x="157" y="318" text-anchor="middle" font-size="15" fill="#666">seed + frontier</text>
    <text x="377" y="290" text-anchor="middle" font-weight="700">Normalize</text><text x="377" y="318" text-anchor="middle" font-size="15" fill="#666">filter invalid URLs</text>
    <text x="597" y="290" text-anchor="middle" font-weight="700">Robots</text><text x="597" y="318" text-anchor="middle" font-size="15" fill="#666">host cache + delay</text>
    <text x="817" y="290" text-anchor="middle" font-weight="700">Fetch</text><text x="817" y="318" text-anchor="middle" font-size="15" fill="#666">HEAD / GET checks</text>
    <text x="1037" y="290" text-anchor="middle" font-weight="700">Extract Links</text><text x="1037" y="318" text-anchor="middle" font-size="15" fill="#666">anchor text</text>
    <text x="377" y="490" text-anchor="middle" font-weight="700">Deduplicate</text><text x="377" y="518" text-anchor="middle" font-size="15" fill="#666">SHA-256 content</text>
    <text x="597" y="490" text-anchor="middle" font-weight="700">Store</text><text x="597" y="518" text-anchor="middle" font-size="15" fill="#666">pt-crawl in KVS</text>
    <text x="817" y="490" text-anchor="middle" font-weight="700">Monitor</text><text x="817" y="518" text-anchor="middle" font-size="15" fill="#666">domain statistics</text>
  </g>
  <g stroke="#b85c1b" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M235 295 H290"/><path d="M455 295 H510"/><path d="M675 295 H730"/><path d="M895 295 H950"/><path d="M1037 340 C1037 410 900 492 902 495"/><path d="M740 495 H685"/><path d="M520 495 H465"/><path d="M377 450 C310 405 255 357 235 330"/></g>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b625a">Controls: max pages/domain · max depth · max URL length · max content size · blacklist patterns</text>
</svg>
